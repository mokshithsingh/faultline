name: faultline

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: faultline
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: faultline
    volumes:
      - pgdata:/var/lib/postgresql
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faultline -d faultline"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node/Express API. Not published on the host: only reachable through nginx (web).
  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Standard Postgres variables, read directly by the pg library.
      # The password is passed as-is, so special characters need no URL-encoding.
      PGHOST: db
      PGPORT: 5432
      PGUSER: faultline
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: faultline
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    cpus: 1.0

  # nginx: serves the built dashboard and proxies /api, /v1, /ingest, /health to api.
  web:
    build: ./dashboard
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api
    mem_limit: 128m
    cpus: 0.5

volumes:
  pgdata:
